name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA Project
        run: |
          mkdir twa
          cd twa
          bubblewrap init --manifest https://username-lu.github.io/mp3-/manifest.json --directory ./app --packageId com.musikgue.app --name "Musik Gue" --display standalone --themeColor "#1db954" --backgroundColor "#0f0f0f" --startUrl "/mp3-/" --iconPath ../icon-512.png --maskableIconPath ../icon-512.png --splashScreenFadeOutDuration 300 --enableNotifications --fallbackType customtabs --webContentsDebuggingEnabled --alpha --skipSigning --skipPwaValidation || true

      - name: Build APK
        run: |
          cd twa/app
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musik-gue-apk
          path: twa/app/app/build/outputs/apk/debug/app-debug.apk
